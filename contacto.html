<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contacto | Gerardo Gutierrez</title>

<link rel="stylesheet" href="./css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<section class="contact-page">

<div class="contact-card">

<h1>Contacto</h1>

<p class="contact-subtitle">
¿Querés ponerte en contacto? Respondemos a la brevedad.
</p>

<form action="https://formspree.io/f/myzdogkj" method="POST" class="contact-form-modern">

<div class="input-group">
<label>Nombre</label>
<input type="text" name="name" placeholder="Tu nombre" required>
</div>

<div class="input-group">
<label>Email</label>
<input type="email" name="email" placeholder="tuemail@mail.com" required>
</div>

<div class="input-group">
<label>Mensaje</label>
<textarea name="message" placeholder="Escribí tu mensaje..." required></textarea>
</div>

<button type="submit">Enviar Mensaje</button>

</form>

<a href="index.html" class="back-link">← Volver al CV</a>

</div>

</section>

</body>
